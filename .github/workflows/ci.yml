name: CI

on:
  push:
    branches: [dev, master, main]
  pull_request:
    branches: [dev, master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-docker:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zhuchka
          POSTGRES_PASSWORD: zhuchka
          POSTGRES_DB: zhuchka_directory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhuchka -d zhuchka_directory_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Config for CI (Postgres service)
        run: python scripts/ci_prep_config.py

      - name: Alembic config
        run: cp alembic.ini.example alembic.ini

      - name: Database migrations
        run: alembic upgrade head

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Docker build
        run: docker build -f docker/Dockerfile -t service:ci .
